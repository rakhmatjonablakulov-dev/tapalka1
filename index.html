<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Тапалка - Заработок</title>
    <!-- Официальный скрипт Telegram Web App -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body {
            background: linear-gradient(135deg, #1f1c2c, #928dab);
            color: white;
            font-family: Arial, sans-serif;
            text-align: center;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: height;
            height: 90vh;
        }
        h1 {
            font-size: 24px;
            margin-bottom: 5px;
        }
        #score {
            font-size: 56px;
            font-weight: bold;
            margin: 20px 0;
            text-shadow: 0 4px 10px rgba(0,0,0,0.3);
        }
        .coin-container {
            flex-grow: 1;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .coin {
            width: 220px;
            height: 220px;
            background: radial-gradient(circle, #f39c12, #d35400);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 80px;
            cursor: pointer;
            box-shadow: 0 15px 35px rgba(243, 156, 18, 0.5);
            user-select: none;
            transition: transform 0.05s ease;
        }
        .coin:active {
            transform: scale(0.92);
        }
        .info {
            font-size: 14px;
            opacity: 0.8;
        }
    </style>
</head>
<body>

    <h1>🪙 Крипто Тапалка</h1>
    <div class="info">Тапай по монете и зарабатывай деньги!</div>
    
    <div id="score">0</div>

    <div class="coin-container">
        <div class="coin" id="tapButton">🪙</div>
    </div>

    <script>
        let score = 0;
        const scoreElement = document.getElementById('score');
        const tapButton = document.getElementById('tapButton');

        // Инициализация Telegram Web App
        const tg = window.Telegram.WebApp;
        tg.expand(); // Разворачиваем на весь экран

        // Получаем ID пользователя Telegram
        const user = tg.initDataUnsafe?.user;
        const userId = user ? user.id : 'unknown';

        tapButton.addEventListener('click', () => {
            score += 1;
            scoreElement.innerText = score;

            // Легкая вибрация при клике на телефоне
            if (tg.HapticFeedback) {
                tg.HapticFeedback.impactOccurred('medium');
            }
        });
    </script>
</body>
</html>
