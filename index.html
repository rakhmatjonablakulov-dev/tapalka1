<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Telegram Tapalka Game</title>
    <!-- Подключаем Telegram Web App SDK -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <!-- Подключаем официальный SDK AdsGram -->
    <script src="https://sad.adsgram.ai/js/adsgram.min.js"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #1f1f1f;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
        }
        button {
            background-color: #2481cc;
            color: white;
            border: none;
            padding: 15px 25px;
            font-size: 18px;
            border-radius: 12px;
            cursor: pointer;
            margin-top: 20px;
        }
        button:active {
            background-color: #1b65a3;
        }
        #score {
            font-size: 24px;
            margin-bottom: 10px;
        }
    </style>
</head>
<body>

    <div id="score">Монеты: <span id="coins">0</span></div>
    
    <!-- Кнопка тапалки -->
    <button id="tapBtn">ТАПАТЬ 🪙</button>

    <!-- Кнопка просмотра рекламы за бонус -->
    <button id="adBtn" style="background-color: #28a745;">Смотреть рекламу (+500 монет) 🎬</button>

    <script>
        // Инициализация Telegram WebApp
        Telegram.WebApp.ready();

        let coins = 0;
        const coinsSpan = document.getElementById('coins');

        // Клик по кнопке тапалки
        document.getElementById('tapBtn').addEventListener('click', () => {
            coins += 1;
            coinsSpan.textContent = coins;
        });

        // Инициализация AdsGram SDK с вашим Block ID (56769)
        const adController = window.Adsgram.init({ blockId: "56769" });

        // Обработка клика по кнопке просмотра рекламы
        document.getElementById('adBtn').addEventListener('click', () => {
            adController.show()
                .then((result) => {
                    // Успех! Пользователь досмотрел рекламу до конца
                    coins += 500;
                    coinsSpan.textContent = coins;
                    alert("Реклама успешно просмотрена! Вы получили +500 монет 🎉");
                })
                .catch((result) => {
                    // Ошибка или пользователь закрыл рекламу досрочно
                    console.log("Реклама не была досмотрена", result);
                    alert("Чтобы получить награду, нужно досмотреть видео до конца!");
                });
        });
    </script>

</body>
</html>
