<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tapalka</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
body {
  margin: 0;
  min-height: 100vh;
  background: #1f1f1f;
  color: white;
  font-family: Arial, sans-serif;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
}
h1 { color: #35aaff; }
#score { font-size: 28px; margin: 25px; }
button {
  width: 85%;
  max-width: 320px;
  padding: 18px;
  margin: 10px;
  border: 0;
  border-radius: 14px;
  font-size: 20px;
  font-weight: bold;
  background: #2481cc;
  color: white;
}
button:disabled { opacity: .5; }
#status { color: #aaa; margin: 15px; text-align: center; }
</style>
</head>
<body>
<h1>🎮 TAPALKA</h1>
<div id="score">Монеты: <span id="coins">0</span></div>
<div>Тапов: <span id="taps">0</span></div>
<button id="tapBtn">ТАПАТЬ 🪙</button>
<div id="status">Подключение...</div>

<script>
alert("Telegram initData: " + (tg.initData ? "ЕСТЬ" : "ПУСТО"));
tg.ready();
tg.expand();

const API = "https://tapalka-umik.onrender.com";
const coinsEl = document.getElementById("coins");
const tapsEl = document.getElementById("taps");
const statusEl = document.getElementById("status");
const tapBtn = document.getElementById("tapBtn");

let busy = false;

async function request(path, method = "GET", body = null) {
  const response = await fetch(API + path, {
    method,
    headers: {
      "Content-Type": "application/json",
      "X-Telegram-Init-Data": tg.initData
    },
    body: body ? JSON.stringify(body) : null
  });

  if (!response.ok) {
    throw new Error("Ошибка сервера: " + response.status);
  }
  return await response.json();
}

async function loadBalance() {
  try {
    const data = await request("/me");
    coinsEl.textContent = data.balance;
    tapsEl.textContent = data.taps;
    statusEl.textContent = "Игра подключена ✅";
    tapBtn.disabled = false;
  } catch (e) {
    statusEl.textContent = "Открой игру через Telegram-бота";
    tapBtn.disabled = true;
  }
}

tapBtn.addEventListener("click", async () => {
  if (busy) return;
  busy = true;
  tapBtn.disabled = true;

  try {
    const data = await request("/tap", "POST", {count: 1});
    coinsEl.textContent = data.balance;
    tapsEl.textContent = data.taps;
    statusEl.textContent = "Монета сохранена ✅";
  } catch (e) {
    statusEl.textContent = "Не удалось сохранить тап. Попробуй ещё раз.";
  } finally {
    busy = false;
    tapBtn.disabled = false;
  }
});

tapBtn.disabled = true;
loadBalance();
</script>
</body>
</html>
