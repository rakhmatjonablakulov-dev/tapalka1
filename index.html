<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Тапалка</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body {
            background-color: #0f172a;
            color: #ffffff;
            font-family: Arial, sans-serif;
            text-align: center;
            padding-top: 40px;
            margin: 0;
        }
        h1 { font-size: 24px; color: #ffffff; }
        #counter { font-size: 52px; font-weight: bold; margin: 20px 0; color: #fbbf24; }
        .tap-btn {
            background: linear-gradient(135deg, #f59e0b, #d97706);
            border: none;
            border-radius: 50%;
            width: 180px;
            height: 180px;
            font-size: 30px;
            font-weight: bold;
            color: white;
            cursor: pointer;
            box-shadow: 0 10px 25px rgba(245, 158, 11, 0.4);
            margin-top: 20px;
        }
        .tap-btn:active { transform: scale(0.92); }
        .save-btn {
            margin-top: 30px;
            background-color: #10b981;
            color: white;
            border: none;
            padding: 14px 28px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 10px;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <h1>🎮 Кликер Тапалка</h1>
    <p>Кликайте по кнопке, чтобы заработать монеты!</p>
    
    <div id="counter">0</div>
    
    <button class="tap-btn" id="tapButton">ТАП!</button>
    <br>
    <button class="save-btn" id="saveButton">💾 Сохранить и зачислить в бот</button>

    <script>
        const tg = window.Telegram.WebApp;
        tg.ready();
        tg.expand();

        let score = 0;
        const counterElement = document.getElementById('counter');
        const tapButton = document.getElementById('tapButton');
        const saveButton = document.getElementById('saveButton');

        tapButton.addEventListener('click', () => {
            score += 1;
            counterElement.textContent = score;
            if (tg.HapticFeedback) {
                tg.HapticFeedback.impactOccurred('light');
            }
        });

        saveButton.addEventListener('click', () => {
            if (score > 0) {
                const dataToSend = JSON.stringify({ coins: score });
                tg.sendData(dataToSend);
            } else {
                alert('Вы еще ничего не накликали!');
            }
        });
    </script>
</body>
</html>
