<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Тапалка</title>
    <!-- Официальный скрипт Telegram Web App -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <!-- Официальный SDK Adsgram -->
    <script src="https://sad.adsgram.ai/js/sad.min.js"></script>
    <style>
        body {
            background-color: #0f172a;
            color: #ffffff;
            font-family: Arial, sans-serif;
            text-align: center;
            padding-top: 30px;
            margin: 0;
            user-select: none;
            -webkit-user-select: none;
        }
        h1 { 
            font-size: 24px; 
            margin-bottom: 5px;
        }
        #counter { 
            font-size: 48px; 
            font-weight: bold; 
            margin: 15px 0; 
            color: #fbbf24; 
        }
        .tap-btn {
            background: linear-gradient(135deg, #f59e0b, #d97706);
            border: none;
            border-radius: 50%;
            width: 170px;
            height: 170px;
            font-size: 28px;
            font-weight: bold;
            color: white;
            cursor: pointer;
            box-shadow: 0 10px 25px rgba(245, 158, 11, 0.4);
            transition: transform 0.05s ease;
            outline: none;
            margin-top: 10px;
        }
        .tap-btn:active { 
            transform: scale(0.92); 
        }
        .ad-btn {
            margin-top: 25px;
            background: linear-gradient(135deg, #3b82f6, #1d4ed8);
            color: white;
            border: none;
            padding: 12px 24px;
            font-size: 15px;
            font-weight: bold;
            border-radius: 10px;
            cursor: pointer;
            box-shadow: 0 4px 12px rgba(59, 130, 246, 0.3);
            display: block;
            margin-left: auto;
            margin-right: auto;
        }
        .ad-btn:hover { 
            background-color: #2563eb; 
        }
        .save-btn {
            margin-top: 15px;
            background-color: #10b981;
            color: white;
            border: none;
            padding: 14px 28px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 10px;
            cursor: pointer;
            box-shadow: 0 4px 12px rgba(16, 185, 129, 0.3);
        }
        .save-btn:hover { 
            background-color: #059669; 
        }
    </style>
</head>
<body>

    <h1>🎮 Кликер Тапалка</h1>
    <p>Кликайте по кнопке или смотрите рекламу за монеты!</p>
    
    <div id="counter">0</div>
    
    <!-- Большая кнопка тапа -->
    <button class="tap-btn" id="tapButton">ТАП!</button>
    
    <br>
    <!-- Кнопка просмотра рекламы Adsgram (награда +100 монет) -->
    <button class="ad-btn" id="adButton">📺 Смотреть рекламу (+100 монет)</button>
    
    <br>
    <!-- Кнопка сохранения монет в бота -->
    <button class="save-btn" id="saveButton">💾 Сохранить и зачислить в бот</button>

    <script>
        // Инициализация Telegram Web App
        const tg = window.Telegram.WebApp;
        tg.ready();
        tg.expand(); // Разворачиваем игру на весь экран

        let score = 0;
        const counterElement = document.getElementById('counter');
        const tapButton = document.getElementById('tapButton');
        const saveButton = document.getElementById('saveButton');
        const adButton = document.getElementById('adButton');

        // Инициализация Adsgram SDK с вашим Block ID
        const adController = window.Adsgram.init({ blockId: "56467" });

        // Обработка кликов (тапов)
        tapButton.addEventListener('click', () => {
            score += 1; // За каждый клик прибавляется 1 монета
            counterElement.textContent = score;
            
            // Легкая вибрация телефона при клике
            if (tg.HapticFeedback) {
                tg.HapticFeedback.impactOccurred('light');
            }
        });

        // Функция показа rewarded-рекламы Adsgram
        adButton.addEventListener('click', () => {
            adController.show()
                .then((result) => {
                    // Пользователь успешно досмотрел рекламу до конца
                    score += 100; // Начисляем бонус
                    counterElement.textContent = score;
                    
                    if (tg.HapticFeedback) {
                        tg.HapticFeedback.notificationOccurred('success');
                    }
                    alert('Реклама просмотрена! Вам начислено 100 монет.');
                })
                .catch((result) => {
                    // Пользователь закрыл рекламу досрочно или произошла ошибка
                    if (tg.HapticFeedback) {
                        tg.HapticFeedback.notificationOccurred('error');
                    }
                    alert('Реклама была закрыта до завершения, награда не выдана.');
                });
        });

        // Отправка данных в бот
        saveButton.addEventListener('click', () => {
            if (score > 0) {
                // Упаковываем монеты в JSON-формат
                const dataToSend = JSON.stringify({ coins: score });
                
                // Передаем данные боту и автоматически закрываем веб-приложение
                tg.sendData(dataToSend);
            } else {
                alert('Вы еще ничего не накликали!');
            }
        });
    </script>
</body>
</html>
