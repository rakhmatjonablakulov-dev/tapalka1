<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Тапалка</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://sad.adsgram.ai/js/adsgram.min.js"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #1f1f1f;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
        }
        button {
            background-color: #2481cc;
            color: white;
            border: none;
            padding: 15px 25px;
            font-size: 18px;
            border-radius: 12px;
            cursor: pointer;
            margin-top: 15px;
            width: 85%;
            max-width: 320px;
        }
        button:active {
            opacity: 0.8;
        }
        #score {
            font-size: 30px;
            margin-bottom: 25px;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <div id="score">Монеты: <span id="coins">0</span></div>
    
    <button id="tapBtn">ТАПАТЬ 🪙</button>
    <button id="adBtn" style="background-color: #28a745;">Смотреть рекламу (+500 монет) 🎬</button>
    <button id="saveBtn" style="background-color: #ffc107; color: black; font-weight: bold;">Сохранить в бот 💾</button>

    <script>
        const tg = window.Telegram.WebApp;
        tg.ready();
        tg.expand();

        let coins = 0;
        const coinsSpan = document.getElementById('coins');

        document.getElementById('tapBtn').addEventListener('click', () => {
            coins += 1;
            coinsSpan.textContent = coins;
        });

        // Инициализация AdsGram
        let adController = null;
        try {
            adController = window.Adsgram.init({ blockId: "56769" });
        } catch (e) {
            console.error("Adsgram init error:", e);
        }

        document.getElementById('adBtn').addEventListener('click', () => {
            if (!adController) {
                alert("Рекламный модуль не инициализирован.");
                return;
            }

            // Вызов рекламы с обработкой загрузки
            adController.show()
                .then((result) => {
                    coins += 500;
                    coinsSpan.textContent = coins;
                    alert("Реклама успешно просмотрена! Получено +500 монет 🎉");
                })
                .catch((result) => {
                    console.log("Ошибка показа рекламы:", result);
                    alert("Не удалось загрузить рекламу. Проверьте интернет или попробуйте позже.");
                });
        });

        document.getElementById('saveBtn').addEventListener('click', () => {
            if (coins <= 0) {
                alert("У вас пока нет монет для сохранения!");
                return;
            }
            tg.sendData(JSON.stringify({ action: "save_coins", amount: coins }));
            tg.close();
        });
    </script>
</body>
</html>
