<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Тапалка</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://sad.adsgram.ai/js/sad.min.js"></script>
    <style>
        body {
            background-color: #0f172a;
            color: #ffffff;
            font-family: Arial, sans-serif;
            text-align: center;
            padding-top: 30px;
            margin: 0;
            user-select: none;
            -webkit-user-select: none;
        }
        h1 { font-size: 24px; color: #ffffff; margin-bottom: 5px; }
        #counter { font-size: 48px; font-weight: bold; margin: 15px 0; color: #fbbf24; }
        .tap-btn {
            background: linear-gradient(135deg, #f59e0b, #d97706);
            border: none;
            border-radius: 50%;
            width: 170px;
            height: 170px;
            font-size: 28px;
            font-weight: bold;
            color: white;
            cursor: pointer;
            box-shadow: 0 10px 25px rgba(245, 158, 11, 0.4);
            margin-top: 10px;
        }
        .tap-btn:active { transform: scale(0.92); }
        .ad-btn {
            margin-top: 20px;
            background: linear-gradient(135deg, #3b82f6, #1d4ed8);
            color: white;
            border: none;
            padding: 12px 24px;
            font-size: 15px;
            font-weight: bold;
            border-radius: 10px;
            cursor: pointer;
            display: block;
            margin-left: auto;
            margin-right: auto;
        }
        .ad-btn:hover { background-color: #2563eb; }
        .save-btn {
            margin-top: 15px;
            background-color: #10b981;
            color: white;
            border: none;
            padding: 14px 28px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 10px;
            cursor: pointer;
        }
        .save-btn:hover { background-color: #059669; }
    </style>
</head>
<body>

    <h1>🎮 Кликер Тапалка</h1>
    <p>Кликайте по кнопке или смотрите рекламу за монеты!</p>
    
    <div id="counter">0</div>
    
    <button class="tap-btn" id="tapButton">ТАП!</button>
    <br>
    <!-- Кнопка рекламы возвращена на экран -->
    <button class="ad-btn" id="adButton">📺 Смотреть рекламу (+100 монет)</button>
    <br>
    <button class="save-btn" id="saveButton">💾 Сохранить и зачислить в бот</button>

    <script>
        const tg = window.Telegram.WebApp;
        try {
            tg.ready();
            tg.expand();
        } catch (e) {}

        let score = 0;
        const counterElement = document.getElementById('counter');
        const tapButton = document.getElementById('tapButton');
        const saveButton = document.getElementById('saveButton');
        const adButton = document.getElementById('adButton');

        // Инициализация Adsgram SDK с вашим Block ID (56467)
        let adController = null;
        try {
            if (window.Adsgram) {
                adController = window.Adsgram.init({ blockId: "56467" });
            }
        } catch (e) {}

        tapButton.addEventListener('click', () => {
            score += 1;
            counterElement.textContent = score;
            if (tg && tg.HapticFeedback) {
                try { tg.HapticFeedback.impactOccurred('light'); } catch (e) {}
            }
        });

        // Обработка показа рекламы
        adButton.addEventListener('click', () => {
            if (!adController) {
                score += 100;
                counterElement.textContent = score;
                alert('Бонус зачислен: +100 монет!');
                return;
            }

            adController.show()
                .then((result) => {
                    score += 100;
                    counterElement.textContent = score;
                    if (tg && tg.HapticFeedback) {
                        try { tg.HapticFeedback.notificationOccurred('success'); } catch (e) {}
                    }
                    alert('Реклама успешно просмотрена! Начислено 100 монет.');
                })
                .catch((result) => {
                    score += 100;
                    counterElement.textContent = score;
                    alert('Начислено 100 монет!');
                });
        });

        saveButton.addEventListener('click', () => {
            if (score > 0) {
                const dataToSend = JSON.stringify({ coins: score });
                if (tg && tg.sendData) {
                    tg.sendData(dataToSend);
                } else {
                    alert('Данные подготовлены: ' + dataToSend);
                }
            } else {
                alert('Вы еще ничего не накликали!');
            }
        });
    </script>
</body>
</html>
